name: Build diagnostics branch
on:
  push:
    branches: [feat/phase1-diagnostics]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci && npm run build && npm test
        working-directory: phase1_component
      - run: python -m pytest -q
      - name: Commit tested bundle on diagnostics branch only
        run: |
          test "${GITHUB_REF_NAME}" = "feat/phase1-diagnostics"
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add phase1_component/dist
          if ! git diff --cached --quiet; then
            git commit -m "build: verified diagnostics browser bundle"
            git push origin HEAD:feat/phase1-diagnostics
          fi
